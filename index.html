<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FamilyPlan" />
    <title>FamilyPlan — Family Finance Control</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('familyplan_theme');
          if (!t) {
            var raw = localStorage.getItem('familyplan_state_v1');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.settings && parsed.settings.theme) {
                t = parsed.settings.theme;
              }
            }
          }
          if (t && (t === 'dark' || t === 'tokyo-night' || t === 'oled' || t === 'light')) {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'tokyo-night');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
